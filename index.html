<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Graph-View</title>
<link rel="stylesheet" href="css/style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/vis-network/9.1.9/standalone/umd/vis-network.min.js"></script>
</head>
<body>
<h1>Graph-View</h1>
<textarea id="in" spellcheck="false">[[0,1,4],[0,2,1],[2,1,2],[1,3,1],[2,3,5]]</textarea>
<small>LeetCode: <code>[[u,v,w],...]</code> &nbsp;|&nbsp; CP: first line <code>n m</code>, then <code>m</code> lines <code>u v [w]</code></small>

<div class="row">
  <label><input type="checkbox" id="d"> directed</label>
  <label><input type="checkbox" id="w" checked> weighted</label>
  <button id="draw">Draw</button>
  <input type="number" id="s" value="0" title="source node">
  <button id="dijkstra">Dijkstra</button>
  <button id="prim">Prim</button>
  <select id="sp">
    <option value="1200">slow</option>
    <option value="600" selected>normal</option>
    <option value="200">fast</option>
  </select>
  <button id="reset">Reset</button>
</div>

<div id="g"></div>
<div id="msg"></div>

<div class="row"><b>Bitwise</b>
  <input id="a" value="12"><input id="b" value="10">
  <span id="bit"></span>
</div>

<script src="js/parser.js"></script>
<script src="js/algorithms.js"></script>
<script src="js/bitwise.js"></script>
<script src="js/app.js"></script>
</body>
</html>
